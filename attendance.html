<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<title>DiTo Attendance</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --ink:#14202e; --mute:#5b6b7d; --brand:#0b5cab; --ok:#157347; --bad:#b42318; --line:#dde3ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e141b; --card:#18212b; --ink:#eef2f7; --mute:#9aa8b8; --brand:#4c9aff; --ok:#4cc38a; --bad:#ff7b6e; --line:#2a3744; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; display:flex; justify-content:center; }
  main { width:100%; max-width:460px; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:4px 0 2px; } .sub { color:var(--mute); margin:0 0 16px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .row { display:flex; align-items:center; gap:10px; margin:6px 0; } .dot { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:none; display:grid; place-items:center; font-size:13px; }
  .dot.ok { background:var(--ok); border-color:var(--ok); color:#fff; } .dot.bad { background:var(--bad); border-color:var(--bad); color:#fff; }
  button { width:100%; border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:600; background:var(--brand); color:#fff; cursor:pointer; }
  button.alt { background:transparent; color:var(--brand); border:1.5px solid var(--brand); margin-top:10px; } button:disabled { opacity:.5; }
  .big { font-size:40px; font-weight:700; text-align:center; margin:2px 0; } .center { text-align:center; }
  video, canvas.prev { width:100%; border-radius:14px; background:#000; display:block; }
  .msg { padding:12px; border-radius:12px; margin-top:10px; font-size:14px; } .msg.err { background:rgba(180,35,24,.12); color:var(--bad); } .msg.good { background:rgba(21,115,71,.12); color:var(--ok); }
  .hide { display:none; } small { color:var(--mute); }
</style>
</head>
<body>
<main>
  <h1>DiTo Enterprises</h1>
  <p class="sub" id="who">Loading…</p>

  <div class="card" id="clockCard">
    <div class="big" id="clock">--:--</div>
    <div class="center sub" id="date" style="margin:0"></div>
    <div class="center sub" id="state" style="margin-top:6px"></div>
  </div>

  <div class="card hide" id="steps">
    <div class="row"><span class="dot" id="d1"></span><span id="t1">Location</span></div>
    <div class="row"><span class="dot" id="d2"></span><span id="t2">Selfie</span></div>
    <div class="row"><span class="dot" id="d3"></span><span id="t3">Send</span></div>
  </div>

  <div class="card hide" id="camCard">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="prev" class="prev hide"></canvas>
    <button id="snap" style="margin-top:12px">Take selfie</button>
    <button id="retake" class="alt hide">Retake</button>
    <input id="file" type="file" accept="image/*" capture="user" class="hide">
  </div>

  <button id="go" class="hide">Sign in</button>
  <button id="send" class="hide">Send</button>
  <div id="msg"></div>
  <p class="sub center" style="margin-top:18px"><small>Your location and selfie are taken only when you tap the button, to mark attendance. Nothing is tracked in between.</small></p>
</main>

<script>
(function () {
  var q = new URLSearchParams(location.search), U = q.get('u') || '', T = q.get('t') || '', S = q.get('s') || '';
  var $ = function (id) { return document.getElementById(id); };
  var st = { kind: 'in', name: '', lat: null, lng: null, acc: null, photo: null, stream: null, nonce: Math.random().toString(36).slice(2) + Date.now().toString(36) };

  function msg(text, cls) { $('msg').innerHTML = text ? '<div class="msg ' + (cls || '') + '">' + text + '</div>' : ''; }
  function dot(n, s) { var d = $('d' + n); d.className = 'dot ' + (s || ''); d.textContent = s === 'ok' ? '✓' : (s === 'bad' ? '!' : ''); }
  function show(id, on) { $(id).classList.toggle('hide', !on); }
  function jsonp(params, cb) {
    var name = 'cb' + Math.random().toString(36).slice(2), s = document.createElement('script'), done = false;
    window[name] = function (d) { done = true; cb(d); s.remove(); delete window[name]; };
    s.onerror = function () { if (!done) cb({ ok: false, error: 'Could not reach the server. Check your internet.' }); };
    var qs = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
    s.src = S + (S.indexOf('?') < 0 ? '?' : '&') + qs + '&callback=' + name + '&_=' + Date.now();
    document.body.appendChild(s);
  }
  function tick() {
    var d = new Date();
    $('clock').textContent = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
    $('date').textContent = d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Kolkata' });
  }
  setInterval(tick, 20000); tick();

  if (!U || !T || !S) { $('who').textContent = 'This link is incomplete.'; msg('Please ask the bot for "my attendance link" in Slack and open that link.', 'err'); return; }

  jsonp({ att: 'who', u: U, t: T }, function (r) {
    if (!r.ok) { $('who').textContent = 'Link problem'; msg(r.error || 'This link is not valid.', 'err'); return; }
    st.name = r.name; st.kind = r.next === 'out' ? 'out' : 'in';
    $('who').textContent = 'Hello, ' + r.name;
    if (r.next === 'done') { $('state').innerHTML = '✅ Signed in and out for today.<br><small>' + (r.rows || []).join(' · ') + '</small>'; return; }
    $('state').innerHTML = r.next === 'in' ? 'You have not signed in yet.' : 'Signed in: ' + (r.rows || []).join(' · ');
    $('go').textContent = r.next === 'in' ? 'Sign in' : 'Sign out'; show('go', true);
  });

  /* ---- step 1: location ---- */
  $('go').onclick = function () {
    msg(''); show('go', false); show('steps', true); dot(1); dot(2); dot(3);
    $('t1').textContent = 'Getting your location…';
    if (!navigator.geolocation) { dot(1, 'bad'); $('t1').textContent = 'This phone cannot share location'; fail('Open this link in Chrome or Safari.'); return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      st.lat = p.coords.latitude; st.lng = p.coords.longitude; st.acc = p.coords.accuracy;
      dot(1, 'ok'); $('t1').textContent = 'Location found (±' + Math.round(st.acc) + ' m)';
      startCamera();
    }, function (e) {
      dot(1, 'bad'); $('t1').textContent = 'Location not allowed';
      fail(e && e.code === 1 ? 'Please allow Location for this page (tap the lock icon near the address, then Permissions), and try again.' : 'Could not get your location. Switch on GPS, go outside the building if needed, and try again.');
    }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
  };
  function fail(t) { msg(t, 'err'); show('go', true); $('go').textContent = 'Try again'; }

  /* ---- step 2: selfie ---- */
  function startCamera() {
    $('t2').textContent = 'Take a selfie'; show('camCard', true);
    var useFile = function () { show('video', false); $('snap').textContent = 'Open camera'; st.mode = 'file'; };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { useFile(); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 1280 } }, audio: false }).then(function (s) {
      st.stream = s; $('video').srcObject = s; st.mode = 'live';
    }).catch(function () { useFile(); });
  }
  $('snap').onclick = function () {
    if (st.mode === 'file') { $('file').click(); return; }
    var v = $('video'); if (!v.videoWidth) return;
    draw(v, v.videoWidth, v.videoHeight);
  };
  $('file').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var img = new Image(); img.onload = function () { draw(img, img.naturalWidth, img.naturalHeight); }; img.src = URL.createObjectURL(f);
  };
  function draw(src, w, h) {
    var max = 720, k = Math.min(1, max / Math.max(w, h)), cw = Math.round(w * k), ch = Math.round(h * k);
    var c = $('prev'); c.width = cw; c.height = ch; var x = c.getContext('2d');
    x.drawImage(src, 0, 0, cw, ch);
    // date, time and place printed on the photo
    var now = new Date(), line1 = st.name + ' · ' + (st.kind === 'in' ? 'SIGN IN' : 'SIGN OUT');
    var line2 = now.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
    var line3 = (st.lat !== null ? st.lat.toFixed(5) + ', ' + st.lng.toFixed(5) + '  ±' + Math.round(st.acc) + ' m' : 'location not shared');
    var fs = Math.max(13, Math.round(cw / 26)), bh = fs * 4.1;
    x.fillStyle = 'rgba(0,0,0,.62)'; x.fillRect(0, ch - bh, cw, bh);
    x.fillStyle = '#fff'; x.font = '600 ' + fs + 'px system-ui,sans-serif'; x.fillText(line1, 10, ch - bh + fs * 1.3);
    x.font = fs + 'px system-ui,sans-serif'; x.fillText(line2, 10, ch - bh + fs * 2.5); x.fillText(line3, 10, ch - bh + fs * 3.65);
    st.photo = c.toDataURL('image/jpeg', 0.62); st.clientTime = now.toISOString();
    if (st.stream) { st.stream.getTracks().forEach(function (t) { t.stop(); }); st.stream = null; }
    show('video', false); show('prev', true); show('snap', false); show('retake', true);
    dot(2, 'ok'); $('t2').textContent = 'Selfie taken'; show('send', true); $('send').textContent = 'Send ' + (st.kind === 'in' ? 'sign in' : 'sign out');
  }
  $('retake').onclick = function () {
    show('prev', false); show('retake', false); show('snap', true); show('send', false); dot(2); st.photo = null;
    if (st.mode === 'live') { show('video', true); startCamera(); } else { $('file').click(); }
  };

  /* ---- step 3: send ---- */
  $('send').onclick = function () {
    $('send').disabled = true; $('retake').disabled = true; $('t3').textContent = 'Sending…'; msg('');
    st.nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
    var body = JSON.stringify({ u: U, t: T, kind: st.kind, lat: st.lat, lng: st.lng, acc: st.acc, photo: st.photo, clientTime: st.clientTime, n: st.nonce });
    fetch(S + (S.indexOf('?') < 0 ? '?' : '&') + 'att=1', { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body }).catch(function () { });
    var tries = 0;
    (function poll() {
      tries++;
      jsonp({ att: 'res', u: U, t: T, n: st.nonce }, function (r) {
        if (r && r.pending) { if (tries > 14) { dot(3, 'bad'); $('t3').textContent = 'No answer yet'; msg('Not sure it was saved. Open the link again to check — if it says signed in, you are done.', 'err'); $('send').disabled = false; return; } setTimeout(poll, 1800); return; }
        if (r && r.ok) {
          dot(3, 'ok'); $('t3').textContent = r.dup ? 'Already recorded' : 'Saved';
          show('send', false); show('camCard', false);
          msg('<b>' + (r.kind === 'In' ? 'Signed in' : 'Signed out') + ' at ' + r.time + '</b><br>' + r.status + ' · ' + r.place + (r.flags && r.flags.length ? '<br><small>Note: ' + r.flags.join('; ') + '</small>' : ''), 'good');
        } else { dot(3, 'bad'); $('t3').textContent = 'Not saved'; msg((r && r.error) || 'Could not save. Please try again.', 'err'); $('send').disabled = false; $('retake').disabled = false; }
      });
    })();
  };
})();
</script>
</body>
</html>
