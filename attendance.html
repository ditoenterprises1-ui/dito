<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<title>DiTo Attendance</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --ink:#14202e; --mute:#5b6b7d; --brand:#0b5cab; --ok:#157347; --bad:#b42318; --line:#dde3ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e141b; --card:#18212b; --ink:#eef2f7; --mute:#9aa8b8; --brand:#4c9aff; --ok:#4cc38a; --bad:#ff7b6e; --line:#2a3744; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; min-height:100vh; display:flex; justify-content:center; }
  main { width:100%; max-width:460px; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:4px 0 2px; } .sub { color:var(--mute); margin:0 0 16px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .row { display:flex; align-items:center; gap:10px; margin:6px 0; } .dot { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:none; display:grid; place-items:center; font-size:13px; }
  .dot.ok { background:var(--ok); border-color:var(--ok); color:#fff; } .dot.bad { background:var(--bad); border-color:var(--bad); color:#fff; }
  button { width:100%; border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:600; background:var(--brand); color:#fff; cursor:pointer; }
  button.alt { background:transparent; color:var(--brand); border:1.5px solid var(--brand); margin-top:10px; } button:disabled { opacity:.5; }
  .big { font-size:40px; font-weight:700; text-align:center; margin:2px 0; } .center { text-align:center; }
  video, canvas.prev { width:100%; border-radius:14px; background:#000; display:block; }
  .msg { padding:12px; border-radius:12px; margin-top:10px; font-size:14px; } .msg.err { background:rgba(180,35,24,.12); color:var(--bad); } .msg.good { background:rgba(21,115,71,.12); color:var(--ok); }
  .hide { display:none; } small { color:var(--mute); }
  .ring { display:grid; place-items:center; margin:6px 0 2px; }
  .ring svg { transform:rotate(-90deg); } .ring .bgc { stroke:var(--line); } .ring .fg { stroke:var(--brand); stroke-linecap:round; transition:stroke-dashoffset .25s linear; }
  .ring.done .fg { stroke:var(--ok); } .ring.bad .fg { stroke:var(--bad); }
  .ringtxt { position:absolute; font-size:22px; font-weight:700; } .ringwrap { position:relative; display:grid; place-items:center; }
  .net { padding:12px 14px; } .net small { font-size:12px; }
  button.tiny { width:auto; padding:8px 14px; font-size:14px; border-radius:10px; background:transparent; color:var(--brand); border:1.5px solid var(--brand); flex:none; }
  .sig { display:flex; align-items:flex-end; gap:3px; height:22px; flex:none; }
  .sig i { width:4px; border-radius:2px; background:var(--line); display:block; }
  .sig i:nth-child(1){height:7px} .sig i:nth-child(2){height:11px} .sig i:nth-child(3){height:16px} .sig i:nth-child(4){height:21px}
  .sig.ok i:nth-child(-n+4), .sig.ok i { background:var(--ok); }
  .sig.weak i:nth-child(-n+2) { background:#d98500; } .sig.off i:nth-child(1) { background:var(--bad); }
  .pend { margin-top:10px; padding:10px 12px; border-radius:10px; background:rgba(217,133,0,.14); color:#d98500; font-size:13px; }
  .pend.stuck { background:rgba(180,35,24,.14); color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>DiTo Enterprises</h1>
  <p class="sub" id="who">Loading…</p>

  <div class="card net" id="netCard">
    <div class="row" style="margin:0">
      <span class="sig" id="sig"><i></i><i></i><i></i><i></i></span>
      <span style="flex:1"><span id="netTxt">Checking the connection…</span><br><small id="netSub"></small></span>
      <button id="tryNow" class="tiny">Try now</button>
    </div>
    <div id="outbox" class="pend hide"></div>
  </div>

  <div class="card" id="clockCard">
    <div class="big" id="clock">--:--</div>
    <div class="center sub" id="date" style="margin:0"></div>
    <div class="center sub" id="state" style="margin-top:6px"></div>
  </div>

  <div class="card hide" id="steps">
    <div class="row"><span class="dot" id="d1"></span><span id="t1">Location</span></div>
    <div class="row"><span class="dot" id="d2"></span><span id="t2">Selfie</span></div>
    <div class="row"><span class="dot" id="d3"></span><span id="t3">Send</span></div>
  </div>

  <div class="card hide" id="camCard">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="prev" class="prev hide"></canvas>
    <button id="snap" style="margin-top:12px">Take selfie</button>
    <button id="retake" class="alt hide">Retake</button>
    <input id="file" type="file" accept="image/*" capture="user" class="hide">
    <input id="file2" type="file" accept="image/*" capture="environment" class="hide">
  </div>

  <div class="card hide" id="progCard">
    <div class="ring ringwrap" id="ring">
      <svg width="132" height="132" viewBox="0 0 132 132">
        <circle class="bgc" cx="66" cy="66" r="58" fill="none" stroke-width="10"></circle>
        <circle class="fg" id="arc" cx="66" cy="66" r="58" fill="none" stroke-width="10" stroke-dasharray="364.4" stroke-dashoffset="364.4"></circle>
      </svg>
      <div class="ringtxt" id="pct">0%</div>
    </div>
    <div class="center sub" id="plabel" style="margin:6px 0 0">Starting…</div>
    <button id="retryPhoto" class="alt hide">Send the photo again</button>
  </div>

  <button id="go" class="hide">Sign in</button>
  <button id="send" class="hide">Send</button>
  <div id="msg"></div>
  <p class="sub center" style="margin-top:18px"><small id="foot">Your location and selfie are taken only when you tap the button, to mark attendance. Nothing is tracked in between.</small></p>
</main>

<script>
(function () {
  var q = new URLSearchParams(location.search), U = q.get('u') || '', T = q.get('t') || '', S = q.get('s') || '';
  // k=visit&c=<check id>: the same page, used at a customer's gate for one photo of the name board.
  var VISIT = (q.get('k') || '') === 'visit', CHECK = (q.get('c') || '').replace(/[^A-Za-z0-9]/g, '');
  var $ = function (id) { return document.getElementById(id); };
  var st = { kind: 'in', name: '', lat: null, lng: null, acc: null, photo: null, stream: null, nonce: Math.random().toString(36).slice(2) + Date.now().toString(36) };
  if (VISIT) st.kind = 'visit';

  function msg(text, cls) { $('msg').innerHTML = text ? '<div class="msg ' + (cls || '') + '">' + text + '</div>' : ''; }
  function dot(n, s) { var d = $('d' + n); d.className = 'dot ' + (s || ''); d.textContent = s === 'ok' ? '✓' : (s === 'bad' ? '!' : ''); }
  function show(id, on) { $(id).classList.toggle('hide', !on); }
  function url(params) {
    params.s = S;   // so the bot always knows the address that really works
    var qs = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
    return S + (S.indexOf('?') < 0 ? '?' : '&') + qs;
  }
  // One small GET, answer included. A script tag is the most forgiving thing there is on a bad line, and
  // it always finishes: either the server answers, or the timeout does.
  function jsonp(params, cb, ms) {
    var name = 'cb' + Math.random().toString(36).slice(2), s = document.createElement('script'), done = false;
    var finish = function (d) {
      if (done) return; done = true;
      try { s.remove(); } catch (e) { } try { delete window[name]; } catch (e) { window[name] = null; }
      cb(d);
    };
    window[name] = function (d) { netSeen(true); finish(d); };
    s.onerror = function () { netSeen(false); finish({ ok: false, offline: true, error: 'Could not reach the server.' }); };
    setTimeout(function () { if (!done) { netSeen(false); finish({ ok: false, offline: true, error: 'The server did not answer.' }); } }, ms || 15000);
    s.src = url(params) + '&callback=' + name + '&_=' + Date.now();
    document.body.appendChild(s);
  }

  /* ---------- the signal strip ---------- */
  var NET = { ok: null, lastOk: 0 };
  function netSeen(ok) { NET.ok = ok === null ? null : !!ok; if (ok) NET.lastOk = Date.now(); paintNet(); }
  function ago(ts) {
    var s = Math.round((Date.now() - ts) / 1000);
    if (s < 5) return 'just now';
    if (s < 60) return s + ' seconds ago';
    var m = Math.round(s / 60);
    return m < 60 ? m + ' minute' + (m > 1 ? 's' : '') + ' ago' : Math.round(m / 60) + ' hour(s) ago';
  }
  function paintNet() {
    var on = navigator.onLine !== false;
    var cls = !on ? 'off' : (NET.ok === true ? 'ok' : (NET.ok === false ? 'weak' : ''));
    $('sig').className = 'sig ' + cls;
    $('netTxt').textContent = !on ? 'No internet on the phone' :
      (NET.ok === true ? 'Connected' : (NET.ok === false ? 'Weak signal – still trying' : 'Checking the connection…'));
    $('netSub').textContent = NET.lastOk ? 'Server answered ' + ago(NET.lastOk) : (NET.ok === false ? 'Not reached yet' : '');
    paintBox();
  }
  setInterval(paintNet, 10000);
  window.addEventListener('online', function () { paintNet(); flush(true); });
  window.addEventListener('offline', paintNet);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { paintNet(); flush(true); } });
  $('tryNow').onclick = function () { netSeen(null); flush(true); if (!boxGet().length) jsonp({ att: 'who', u: U, t: T }, function (r) { if (r && r.ok) { cacheWho(r); paintWho(r); } }); };

  /* ---------- the outbox: a tap is never lost ----------
   * The mark is written here the moment he presses Send. From then on it is only a question of when it goes,
   * never whether. The same copy is mirrored into IndexedDB so the service worker can send it with the page shut. */
  var BOX = 'ditoAtt_' + U, DB = null, TIMER = null, STEPS = [0, 5, 15, 30, 60, 120, 300];
  function boxGet() { try { return JSON.parse(localStorage.getItem(BOX) || '[]'); } catch (e) { return []; } }
  function boxSet(a) {
    try { localStorage.setItem(BOX, JSON.stringify(a)); }
    catch (e) {   // the phone's storage is full: the attendance matters, the selfie does not
      try { a.forEach(function (x) { if (x.mode !== 'visit') x.photo = null; }); localStorage.setItem(BOX, JSON.stringify(a)); }
      catch (e2) { try { a.forEach(function (x) { x.photo = null; }); localStorage.setItem(BOX, JSON.stringify(a)); } catch (e3) { } }
    }
    mirror(a); paintBox();
  }
  function idb(cb) {
    if (DB) return cb(DB);
    try {
      var rq = indexedDB.open('dito-att', 1);
      rq.onupgradeneeded = function () { try { rq.result.createObjectStore('outbox', { keyPath: 'id' }); } catch (e) { } };
      rq.onsuccess = function () { DB = rq.result; cb(DB); };
      rq.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }
  function mirror(a) {
    idb(function (d) {
      if (!d) return;
      try {
        var os = d.transaction('outbox', 'readwrite').objectStore('outbox');
        os.clear();
        // the worker only ever needs the small mark, never the picture - except a visit, where the picture IS the mark
        a.forEach(function (x) {
          var c = {}; for (var k in x) if (k !== 'photo') c[k] = x[k];
          if (x.mode === 'visit') { c.url = S + (S.indexOf('?') < 0 ? '?' : '&') + 'att=1'; c.body = visitBody(x); }
          else c.url = url({ att: 'mark', u: U, t: T, kind: x.kind, lat: x.lat, lng: x.lng, acc: x.acc, ct: x.ct, wp: x.wp, n: x.n });
          os.put(c);
        });
      } catch (e) { }
    });
  }
  function visitBody(x) {
    return JSON.stringify({ u: U, t: T, s: S, visit: 1, c: x.c, n: x.n, lat: x.lat, lng: x.lng, acc: x.acc, ct: x.ct, photo: x.photo || null });
  }
  function what(it) { return it.mode === 'visit' ? 'visit photo' : (it.kind === 'in' ? 'sign in' : 'sign out'); }
  function paintBox() {
    var a = boxGet(), el = $('outbox');
    if (!a.length) { el.className = 'pend hide'; return; }
    var it = a[0], mins = Math.round((Date.now() - it.at) / 60000), stuck = mins >= 30;
    el.className = 'pend' + (stuck ? ' stuck' : '');
    el.innerHTML = (stuck ? '<b>Still not sent after ' + mins + ' minutes.</b><br>Your ' + what(it) +
        ' of ' + it.clock + ' is safe on your phone and keeps trying. Tell your manager if you can.'
      : '⏳ <b>' + a.length + ' waiting to send</b> – ' + what(it) + ' of ' + it.clock +
        '. It will go by itself, you can lock the phone.');
  }
  function bgSync() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.ready.then(function (reg) { if (reg.sync) return reg.sync.register('dito-att'); }).catch(function () { });
  }
  function flush(manual) {
    var a = boxGet();
    paintBox();
    if (!a.length) return;
    var it = a[0];
    if (it.sending && !manual) return;
    it.sending = 1; boxSet(a);
    var landed = function (r) {
      var cur = boxGet(), top = cur[0];
      if (!top || top.id !== it.id) { schedule(); return; }   // the worker got there first
      if (r && r.ok) { cur.shift(); boxSet(cur); onMarked(r, it); schedule(); return; }
      if (r && r.ok === false && !r.offline && !r.retry) {   // the server refused it: trying again will not help
        cur.shift(); boxSet(cur); onRefused(r); schedule(); return;
      }
      top.sending = 0; top.tries = (top.tries || 0) + 1; boxSet(cur);
      schedule();
    };
    // A visit is one request with the picture inside it, so it goes as a POST with the progress circle.
    if (it.mode === 'visit') { sendVisit(it, landed); return; }
    jsonp({ att: 'mark', u: U, t: T, kind: it.kind, lat: it.lat, lng: it.lng, acc: it.acc, ct: it.ct, wp: it.wp, n: it.n }, landed);
  }
  function sendVisit(it, landed) {
    show('progCard', true); show('retryPhoto', false);
    ring(5, '', 'Sending the photo…');
    postJSON(visitBody(it), function (f) { ring(5 + f * 85, '', 'Sending the photo…'); }, function (sent) {
      if (!sent) { netSeen(false); landed({ ok: false, offline: true }); return; }
      netSeen(true);
      ring(95, '', 'Saving…');
      waitFor(it.n, 0, function (r) { landed(r || { ok: false, offline: true }); });
    });
  }
  function schedule() {
    clearTimeout(TIMER);
    var a = boxGet();
    if (!a.length) return;
    var n = Math.min(a[0].tries || 0, STEPS.length - 1);
    TIMER = setTimeout(function () { flush(); }, Math.max(2, STEPS[n]) * 1000);
    bgSync();
  }
  function tick() {
    var d = new Date();
    $('clock').textContent = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
    $('date').textContent = d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Kolkata' });
  }
  setInterval(tick, 20000); tick();

  if (!U || !T || !S) { $('who').textContent = 'This link is incomplete.'; msg('Please ask the bot for "my attendance link" in Slack and open that link.', 'err'); return; }

  /* Who he is and what he should press. Remembered from the last good load, so a dead signal never leaves
     him looking at a page with no button on it. The server refuses a second mark anyway, so offering the
     button when we are not sure costs nothing. */
  var WHO = 'ditoWho_' + U;
  function cacheWho(r) { try { localStorage.setItem(WHO, JSON.stringify({ d: new Date().toDateString(), r: r })); } catch (e) { } }
  function paintWho(r) {
    st.name = r.name;
    if (VISIT) { $('who').textContent = 'Hello, ' + r.name; return; }   // a visit never changes the button
    st.kind = r.next === 'out' ? 'out' : 'in';
    $('who').textContent = 'Hello, ' + r.name;
    if (r.next === 'done') { $('state').innerHTML = '✅ Signed in and out for today.<br><small>' + (r.rows || []).join(' · ') + '</small>'; show('go', false); return; }
    $('state').innerHTML = r.next === 'in' ? 'You have not signed in yet.' : 'Signed in: ' + (r.rows || []).join(' · ');
    $('go').textContent = r.next === 'in' ? 'Sign in' : 'Sign out'; show('go', true);
  }
  /* A visit: no sign in, no sign out, no waiting on the server before he can press anything. The button is
     there the moment the page opens, because he is standing at a gate on one bar of signal. */
  if (VISIT) {
    (function () {
      $('t2').textContent = 'Photo of the name board';
      $('snap').textContent = 'Take the photo';
      $('go').textContent = 'Take the photo'; show('go', true);
      $('state').innerHTML = 'One photo of the name board or the entrance.<br><small>Your location is taken at the same moment – that is what puts the visit on record.</small>';
      $('foot').textContent = 'The photo and your location are taken only when you tap the button. Nothing is tracked in between.';
      var c = null;
      try { c = JSON.parse(localStorage.getItem(WHO) || 'null'); } catch (e) { }
      if (c && c.r && c.r.name) st.name = c.r.name;
      if (!CHECK) { $('who').textContent = 'Link problem'; msg('This photo link is incomplete. Save the call again and use the new link.', 'err'); show('go', false); return; }
      $('who').textContent = st.name ? 'Hello, ' + st.name : 'Visit photo';
      jsonp({ att: 'who', u: U, t: T }, function (r) { if (r && r.ok) { cacheWho(r); paintWho(r); } });
      var qv = boxGet(), dv = false;
      qv.forEach(function (x) { if (x.sending) { x.sending = 0; dv = true; } });
      if (dv) boxSet(qv);
      paintNet(); paintBox(); schedule();
    })();
  } else (function () {
    var c = null;
    try { c = JSON.parse(localStorage.getItem(WHO) || 'null'); } catch (e) { }
    if (c && c.d === new Date().toDateString() && c.r && c.r.name) paintWho(c.r);
    jsonp({ att: 'who', u: U, t: T }, function (r) {
      if (r && r.ok) { cacheWho(r); paintWho(r); return; }
      if (r && r.offline) {   // the signal, not the link
        if (!st.name) {
          $('who').textContent = c && c.r && c.r.name ? 'Hello, ' + c.r.name : 'Working offline';
          $('state').innerHTML = 'I could not check with the server, so this is from memory.';
          $('go').textContent = 'Sign in'; show('go', true);
        }
        msg('No answer from the server yet – you can still mark attendance. It will be saved on your phone and sent by itself.', '');
        return;
      }
      $('who').textContent = 'Link problem';
      msg((r && r.error) || 'This link is not valid. Ask the bot for "my attendance link" in Slack.', 'err');
    });
    // a send that was cut off mid-way (page closed, phone slept) must not leave the queue marked busy for ever
    var q = boxGet(), dirty = false;
    q.forEach(function (x) { if (x.sending) { x.sending = 0; dirty = true; } });
    if (dirty) boxSet(q);
    paintNet(); paintBox(); schedule();
  })();

  /* ---- step 1: location ---- */
  $('go').onclick = function () {
    msg(''); show('go', false); show('steps', true); dot(1); dot(2); dot(3);
    $('t1').textContent = 'Getting your location…';
    if (!navigator.geolocation) { dot(1, 'bad'); $('t1').textContent = 'This phone cannot share location'; fail('Open this link in Chrome or Safari.'); return; }
    // a quick rough fix first so nobody waits on site; the accurate one keeps coming in the background
    var got = false, watch = null;
    var take = function (p, exact) {
      st.lat = p.coords.latitude; st.lng = p.coords.longitude; st.acc = p.coords.accuracy;
      $('t1').textContent = 'Location found (\u00B1' + Math.round(st.acc) + ' m)' + (exact ? '' : ' \u2013 improving\u2026');
      if (got) return;
      got = true; dot(1, 'ok'); startCamera();
      try { watch = navigator.geolocation.watchPosition(function (p2) { if (p2.coords.accuracy <= st.acc) { st.lat = p2.coords.latitude; st.lng = p2.coords.longitude; st.acc = p2.coords.accuracy; $('t1').textContent = 'Location found (\u00B1' + Math.round(st.acc) + ' m)'; } }, function () { }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }); } catch (e) { }
      st.watch = watch;
    };
    var failed = function (e) {
      if (got) return;
      dot(1, 'bad'); $('t1').textContent = 'Location not allowed';
      fail(e && e.code === 1 ? 'Please allow Location for this page (tap the lock icon near the address, then Permissions), and try again.' : 'Could not get your location. Switch on GPS, go outside the building if you can, and try again.');
    };
    navigator.geolocation.getCurrentPosition(function (p) { take(p, false); }, function () {
      navigator.geolocation.getCurrentPosition(function (p) { take(p, true); }, failed, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 120000 });
  };
  function fail(t) { msg(t, 'err'); show('go', true); $('go').textContent = 'Try again'; }

  /* ---- step 2: selfie ---- */
  function camInput() { return VISIT ? $('file2') : $('file'); }   // a visit wants the back camera, a selfie the front one
  function startCamera() {
    $('t2').textContent = VISIT ? 'Photo of the name board' : 'Take a selfie'; show('camCard', true);
    var useFile = function () { show('video', false); $('snap').textContent = 'Open camera'; st.mode = 'file'; };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { useFile(); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: VISIT ? { ideal: 'environment' } : 'user', width: { ideal: 640 }, height: { ideal: 854 } }, audio: false }).then(function (s) {
      st.stream = s; $('video').srcObject = s; st.mode = 'live';
    }).catch(function () { useFile(); });
  }
  $('snap').onclick = function () {
    if (st.mode === 'file') { camInput().click(); return; }
    var v = $('video'); if (!v.videoWidth) return;
    draw(v, v.videoWidth, v.videoHeight);
  };
  $('file').onchange = $('file2').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var img = new Image(); img.onload = function () { draw(img, img.naturalWidth, img.naturalHeight); }; img.src = URL.createObjectURL(f);
  };
  function draw(src, w, h) {
    // small on purpose: it has to go up on site data, and smaller still when the phone says the line is bad
    var slow = false;
    try { var c4 = navigator.connection || {}; slow = /^(slow-)?2g$|^3g$/.test(String(c4.effectiveType || '')) || c4.saveData === true; } catch (e) { }
    var max = slow ? 380 : 540, k = Math.min(1, max / Math.max(w, h)), cw = Math.round(w * k), ch = Math.round(h * k);
    var c = $('prev'); c.width = cw; c.height = ch; var x = c.getContext('2d');
    x.drawImage(src, 0, 0, cw, ch);
    // date, time and place printed on the photo
    var now = new Date(), line1 = (st.name || '') + ' · ' + (VISIT ? 'VISIT' : (st.kind === 'in' ? 'SIGN IN' : 'SIGN OUT'));
    var line2 = now.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
    var line3 = (st.lat !== null ? st.lat.toFixed(5) + ', ' + st.lng.toFixed(5) + '  ±' + Math.round(st.acc) + ' m' : 'location not shared');
    var fs = Math.max(13, Math.round(cw / 26)), bh = fs * 4.1;
    x.fillStyle = 'rgba(0,0,0,.62)'; x.fillRect(0, ch - bh, cw, bh);
    x.fillStyle = '#fff'; x.font = '600 ' + fs + 'px system-ui,sans-serif'; x.fillText(line1, 10, ch - bh + fs * 1.3);
    x.font = fs + 'px system-ui,sans-serif'; x.fillText(line2, 10, ch - bh + fs * 2.5); x.fillText(line3, 10, ch - bh + fs * 3.65);
    st.photo = c.toDataURL('image/jpeg', slow ? 0.4 : 0.5); st.clientTime = now.toISOString();
    if (st.stream) { st.stream.getTracks().forEach(function (t) { t.stop(); }); st.stream = null; }
    show('video', false); show('prev', true); show('snap', false); show('retake', true);
    dot(2, 'ok'); $('t2').textContent = VISIT ? 'Photo taken' : 'Selfie taken'; show('send', true);
    $('send').textContent = VISIT ? 'Send the photo' : ('Send ' + (st.kind === 'in' ? 'sign in' : 'sign out'));
  }
  // Android keeps sending the outbox even with the page closed and the phone locked.
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) { } }
  $('retake').onclick = function () {
    show('prev', false); show('retake', false); show('snap', true); show('send', false); dot(2); st.photo = null;
    if (st.mode === 'live') { show('video', true); startCamera(); } else { camInput().click(); }
  };

  /* ---- step 3: send ----
     Two requests on purpose. The first one is tiny and marks the attendance, so it is done in a second even on
     site data. The selfie follows as a second request with a real progress circle; if it fails, the attendance
     is already marked and the managers are told the photo did not arrive. */
  var ARC = 364.4;
  function ring(pct, state, label) {
    var p = Math.max(0, Math.min(100, Math.round(pct)));
    $('arc').setAttribute('stroke-dashoffset', String(ARC - ARC * p / 100));
    $('pct').textContent = p + '%';
    $('ring').className = 'ring ringwrap' + (state ? ' ' + state : '');
    if (label) $('plabel').textContent = label;
  }
  function postJSON(body, onProgress, done) {   // XHR, because it is the only way to know how much has really gone up
    var x = new XMLHttpRequest();
    x.open('POST', S + (S.indexOf('?') < 0 ? '?' : '&') + 'att=1', true);
    x.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
    if (x.upload && onProgress) x.upload.onprogress = function (e) { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = function () { done(true); };
    x.onerror = function () { done(false); };
    x.ontimeout = function () { done(false); };
    x.timeout = 120000;
    try { x.send(body); } catch (e) { done(false); }
  }
  function waitFor(nonce, tries, cb) {
    jsonp({ att: 'res', u: U, t: T, n: nonce }, function (r) {
      if (r && r.pending) {
        if (tries > 20) { cb(null); return; }
        setTimeout(function () { waitFor(nonce, tries + 1, cb); }, tries < 4 ? 700 : 1500);
        return;
      }
      cb(r);
    });
  }
  function sendPhoto(attempt) {
    if (!st.photo) return;
    show('progCard', true); show('retryPhoto', false);
    ring(0, '', 'Sending the photo…');
    var n2 = 'p' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    var body = JSON.stringify({ u: U, t: T, s: S, kind: st.kind, n: n2, photoOnly: 1, photo: st.photo });
    postJSON(body, function (f) { ring(5 + f * 85, '', 'Sending the photo…'); }, function (sent) {
      if (!sent) {
        if (attempt < 2) { ring(0, 'bad', 'Signal dropped – trying again…'); setTimeout(function () { sendPhoto(attempt + 1); }, 1500); return; }
        ring(100, 'bad', 'Photo did not go. Your attendance is saved.');
        show('retryPhoto', true);
        return;
      }
      ring(95, '', 'Saving the photo…');
      waitFor(n2, 0, function (r) {
        if (r && r.ok) { ring(100, 'done', 'Photo saved ✓'); setTimeout(function () { show('progCard', false); }, 2500); }
        else if (attempt < 2) { sendPhoto(attempt + 1); }
        else { ring(100, 'bad', (r && r.error) || 'Photo did not save. Your attendance is saved.'); show('retryPhoto', true); }
      });
    });
  }
  $('retryPhoto').onclick = function () { sendPhoto(0); };
  function onMarked(r, it) {
    if ((it && it.mode === 'visit') || r.kind === 'Visit') {
      ring(100, 'done', r.dup ? 'Already sent ✓' : 'Photo sent ✓');
      dot(3, 'ok'); $('t3').textContent = r.dup ? 'Already sent' : 'Sent';
      show('send', false); show('camCard', false); show('go', false);
      try { if (st.watch) navigator.geolocation.clearWatch(st.watch); } catch (e) { }
      msg(r.dup ? '<b>This visit is already on record.</b><br>Nothing more to do.'
        : '<b>Photo sent.</b><br>' + (r.status || 'Checking the location…') + '<br><small>You will get one line in Slack once the location is checked. You can walk on.</small>', 'good');
      setTimeout(function () { show('progCard', false); }, 3000);
      return;
    }
    ring(100, r.waiting ? '' : 'done', r.waiting ? 'Sent to your manager' : 'Attendance saved ✓');
    dot(3, 'ok'); $('t3').textContent = r.dup ? 'Already recorded' : (r.waiting ? 'Waiting for your manager' : 'Saved');
    show('send', false); show('camCard', false);
    try { if (st.watch) navigator.geolocation.clearWatch(st.watch); } catch (e) { }
    msg('<b>' + (r.kind === 'In' ? 'Signed in' : 'Signed out') + ' at ' + r.time + '</b><br>' + r.status + ' · ' + r.place +
      (r.late ? '<br><small>It waited ' + r.late + ' minutes on your phone for a signal. It is recorded at ' + r.time + ', the time you tapped.</small>' : '') +
      (r.waiting ? '<br><small>You are away from the office, so a manager has to confirm it. You will get a message in Slack.</small>' : '') +
      (r.flags && r.flags.length ? '<br><small>Note: ' + r.flags.join('; ') + '</small>' : ''), r.waiting ? '' : 'good');
    if (r.dup) { show('progCard', false); return; }
    // the selfie rides in the outbox too, so it still goes up even if he closed the page before the signal came back
    if (!st.photo && it && it.photo) { st.photo = it.photo; st.kind = it.kind; }
    if (st.photo) setTimeout(function () { sendPhoto(0); }, 300);
  }
  function onRefused(r) {
    ring(100, 'bad', 'Not saved');
    dot(3, 'bad'); $('t3').textContent = 'Not saved';
    msg((r && r.error) || 'The server would not accept this. Please tell your manager.', 'err');
    $('send').disabled = false; $('retake').disabled = false;
  }
  /* Press once. From here it is the phone's job, not his. */
  $('send').onclick = function () {
    $('send').disabled = true; $('retake').disabled = true; msg('');
    var now = new Date();
    var it = {
      id: 'a' + Date.now() + Math.random().toString(36).slice(2, 6),
      n: Math.random().toString(36).slice(2) + Date.now().toString(36),
      kind: st.kind, lat: st.lat, lng: st.lng, acc: Math.round(st.acc || 0),
      ct: st.clientTime || now.toISOString(), wp: st.photo ? 1 : 0, photo: st.photo || null, who: st.name || '',
      clock: now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' }),
      at: Date.now(), tries: 0
    };
    st.pendingId = it.id;
    if (VISIT) { it.mode = 'visit'; it.c = CHECK; it.wp = 1; }
    var a = boxGet(); a.push(it); boxSet(a);
    show('progCard', true); ring(25, '', 'Saved on your phone – sending…');
    dot(3, 'ok'); $('t3').textContent = 'Saved on your phone';
    msg('Saved on your phone. It goes as soon as there is signal – you can lock the phone and walk on.', 'good');
    flush(true);
  };
})();
</script>
</body>
</html>
